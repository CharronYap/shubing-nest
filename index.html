<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe3f0">
<!-- 新風格（紙雕立體）是預設；網址加 ?look=old 回到原本的樣子，js/paper.js 看同一個參數。
     放這麼前面：第一眼（封面）就要是對的顏色，不然會先閃一下粉紅。晚上先掛 pp-n0 用晚上的底色，等 js/paper.js 載好再照實際的天色換。 -->
<script>(function(){var old=false,d=document,r=d.documentElement;try{old=new URLSearchParams(location.search).get('look')==='old'}catch(e){}
var f=d.createElement('link');f.rel='preload';f.as='font';f.type='font/woff2';f.crossOrigin='';f.href=old?'fonts/gensen-rounded-heavy.woff2':'fonts/lxgw-wenkai-tc-medium-subset.woff2';d.head.appendChild(f);
if(old){var m=d.querySelector('meta[name=theme-color]');if(m)m.content='#ffe3ef';return}
r.classList.add('look-paper');var h=new Date().getHours();if(h>=19||h<5)r.classList.add('pp-n0')})();</script>
<!-- 加到手機主畫面時像 app 一樣全螢幕開（沒有離線快取，每次都是抓最新版） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="薯餅的小窩">
<title>薯餅的小窩</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon/apple-touch-icon.png">
<!-- 版本（2026-11-27）。每次推上去都要把下面 NEST_V 那一行換掉，只改這一個地方：
     所有 css 和 js 的網址都會帶上 ?v=這個字，手機（尤其是加到主畫面的那一種）才不會一直用快取裡的舊檔。
     小窩指南最下面會顯示這個字；開著的頁面回到前景時會抓一次 index.html 比對，不一樣就問要不要換上（js/version.js）。
     NEST_JS 是載入順序，不能亂動：traveldata、abroad（裡面有土產的家具定義）一定要在 main 前面，main 一開始就會畫房間。 -->
<script>
var NEST_V='1127-14';
var NEST_JS=['data','social','furn2','furn3','sky','looks','save','season','wardrobe','room','rooms','paper','yard','traveldata','abroad','claw','main','album','gift','away','pals','visit','photo','trip','mailai','mail','earn','games','shop','furnfx','nestgift','book','want','water','stay','card','roamdata','roam','roam2','skitdata','skit','spin','memo','hide','seen','friend','travel','hud','guide','music','cover','version'];
(function(){var v='?v='+NEST_V,h='';
['css/style.css','css/cover.css','css/paper.css','css/account.css'].forEach(function(f){h+='<link rel="stylesheet" href="'+f+v+'">'});
NEST_JS.forEach(function(n){h+='<link rel="preload" as="script" href="js/'+n+'.js'+v+'">'});   // 先一起抓，照順序跑（下面是一個接一個寫出來的，沒有這一行會變成一個抓完才抓下一個）
h+='<script type="importmap">'+JSON.stringify({imports:{'./js/cloud.js':'./js/cloud.js'+v,'./js/cloud-config.js':'./js/cloud-config.js'+v,'./js/wallet.js':'./js/wallet.js'+v}})+'<\/script>';
document.write(h)})();
</script>
</head>
<body>
<div class="phone"><div class="screen" id="screen">
      <div class="top">
        <button class="ib" id="swap" aria-label="去娃娃機"></button>
        <div id="nav"></div>
        <div class="pity" id="pity" hidden></div>
        <div class="topr">
          <button class="ib w sm" id="albBtn" aria-label="娃娃相簿"><svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v14H6.5A1.5 1.5 0 0 0 5 19.5z" fill="currentColor"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 14s-3.2-1.9-3.2-4c0-1 .8-1.8 1.7-1.8.6 0 1.1.3 1.5.8.4-.5.9-.8 1.5-.8.9 0 1.7.8 1.7 1.8 0 2.1-3.2 4-3.2 4z" fill="#fff"/></svg></button>
          <button class="ib w sm mbtn" id="musicBtn" aria-label="關掉音樂" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 17.5V6.5l10-2.3v11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.6" cy="17.6" r="2.9" fill="currentColor"/><circle cx="16.6" cy="15.4" r="2.9" fill="currentColor"/><path class="mx" d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
          <span class="coin" id="coinPill" role="button" tabindex="0" aria-label="幣，點一下看怎麼賺"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd75e" stroke="#d98e00" stroke-width="2"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#fff3b8" stroke-width="1.6"/><path d="M12 15.6s-3.4-2-3.4-4.2c0-1.1.8-1.9 1.8-1.9.7 0 1.2.4 1.6.9.4-.5.9-.9 1.6-.9 1 0 1.8.8 1.8 1.9 0 2.2-3.4 4.2-3.4 4.2z" fill="#ff8fbf"/></svg><span id="coins">0</span></span>
          <button class="ib w" id="evBtn" aria-label="今天的小事"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.6 3.6c-.5.4-1.2 0-1.2-.6V16h.3A2.5 2.5 0 0 1 4 13.5z"/><g fill="#fff"><circle cx="8.5" cy="9.6" r="1.4"/><circle cx="12" cy="9.6" r="1.4"/><circle cx="15.5" cy="9.6" r="1.4"/></g></svg><span class="bd" hidden></span></button>
        </div>
      </div>
      <div class="page" id="roomPage">
      <div class="area" id="area">
        <div class="stage" id="stage">
          <div class="room" id="room">
            <div class="wall" id="wall"></div>
            <div class="floor" id="floor"></div>
            <div class="win" id="win"></div>
            <div class="nightov"></div>
            <button class="lsw" id="lsw" aria-label="關燈" aria-pressed="true"><svg viewBox="0 0 24 32"><rect x="1.5" y="1.5" width="21" height="29" rx="6" fill="#fff" stroke="#e7cfdc" stroke-width="2"/><rect x="7" y="6" width="10" height="20" rx="4" fill="#ffe3ef"/><rect class="nub" x="8" y="7.5" width="8" height="9" rx="3" fill="#ff8fbf"/></svg></button>
          </div>
        </div>
      </div>
      <div class="tray" id="tray">
        <button class="grip" id="grip" aria-label="收起收納架"><i></i></button>
        <button class="trayopen" id="trayOpen" aria-label="打開收納架" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M3.5 10h17l-1.4 9.2a2 2 0 0 1-2 1.8H6.9a2 2 0 0 1-2-1.8z" fill="currentColor"/><path d="M2.5 7.5A1.5 1.5 0 0 1 4 6h16a1.5 1.5 0 0 1 1.5 1.5V10h-19z" fill="#ffc2dc"/><rect x="9" y="12.5" width="6" height="2.6" rx="1.3" fill="#ff8fbf"/><path d="M7 6c.4-1.8 1.6-3 3-3M17 6c-.4-1.8-1.6-3-3-3" fill="none" stroke="#ffc2dc" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div class="tabs">
          <button class="tab on" data-tab="doll" aria-label="娃娃"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13.5" rx="7.5" ry="8.5" fill="currentColor"/><circle cx="9.3" cy="13" r="1.2" fill="#fff"/><circle cx="14.7" cy="13" r="1.2" fill="#fff"/><path d="M10.5 16.2q1.5 1.2 3 0" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><small>娃娃</small></button>
          <button class="tab" data-tab="furn" aria-label="家具"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="6" width="16" height="9" rx="4"/><rect x="2" y="10" width="5" height="8" rx="2.5"/><rect x="17" y="10" width="5" height="8" rx="2.5"/><rect x="5" y="13" width="14" height="5" rx="2"/><rect x="5" y="18" width="2" height="3" rx="1"/><rect x="17" y="18" width="2" height="3" rx="1"/></svg><small>家具</small></button>
          <button class="tab" data-tab="deco" aria-label="牆和地板"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="15" height="7" rx="2.5"/><path d="M18 6.5h2.5v6H11v3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="15" width="4" height="7" rx="1.5"/></svg><small>牆地</small></button>
          <button class="tab" data-tab="keep" aria-label="紀念品"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.600 5.400 5.900.800-4.300 4.100 1.100 5.900L12 16.400 6.700 19.200l1.100-5.900L3.500 9.200l5.900-.800z"/></svg><small>紀念</small></button>
          <span class="sp"></span>
          <!-- 雲朵系列那顆（五個點）拿掉了：2026-11-27 使用者說看不懂。系列進度改成家具那一頁最上面的一行字。元素留著是因為程式還會找它 -->
          <button class="setb" id="setb" aria-label="雲朵系列" hidden tabindex="-1"><span class="cl"></span><span class="dots" id="setdots"></span></button>
          <span class="tab back"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v12M6 12l6 6 6-6"/></svg>收回</span>
        </div>
        <div class="items" id="items"></div>
      </div>
      <div class="tray vbar" id="vbar" hidden></div>
      <div class="yard" id="yard" hidden><div class="yd-map" id="ydMap"></div><div class="yd-panel" id="ydPanel"></div></div>
      </div>
      <div class="page" id="clawPage" hidden>
        <div class="cwrap">
          <canvas id="claw" width="360" height="440" aria-label="娃娃機"></canvas>
          <div class="ctrl" id="ctrl"></div>
          <div class="optc" id="optClaw"></div>
        </div>
      </div>
      <div class="cover" id="cover">
        <div class="cv-floor"></div>
        <div class="cv-cvs">
          <div class="cv-win"></div>
          <div class="cv-rug"></div>
          <h1 class="cv-ttl" id="coverTitle" aria-label="薯餅的小窩"></h1>
          <div class="cv-stg" aria-hidden="true">
            <div class="cv-sofa"><i class="cv-lg cv-l"></i><i class="cv-lg cv-r"></i><div class="cv-bk"></div><div class="cv-st"></div><div class="cv-ar cv-l"></div><div class="cv-ar cv-r"></div></div>
            <img class="cv-pk" src="img/piggy.png" alt="" style="width:92px;left:calc(50% - 128px);bottom:118px;--d:-.8s">
            <img class="cv-pk" src="img/nyanko.png" alt="" style="width:88px;left:calc(50% + 46px);bottom:122px;--d:-2s">
            <img class="cv-sw" src="img/cover/sloth_orange.webp" alt="" style="width:170px;left:50%;margin-left:-85px;bottom:58px">
            <img class="cv-sw" src="img/egg.png" alt="" style="width:96px;left:calc(50% - 148px);bottom:66px;--d:-1.4s">
            <img class="cv-sw" src="img/dog.png" alt="" style="width:100px;left:calc(50% + 52px);bottom:62px;--d:-2.8s">
          </div>
          <button class="cv-go" id="coverGo" aria-label="開始"><span><svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.8-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg></span></button>
        </div>
        <button class="cv-cb cv-mu mbtn" id="coverMusic" aria-label="關掉音樂" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 17.5V6.5l10-2.3v11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.6" cy="17.6" r="2.9" fill="currentColor"/><circle cx="16.6" cy="15.4" r="2.9" fill="currentColor"/><path class="mx" d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        <!-- 封面不放娃娃機的鈕了（2026-11-27 使用者說不需要）：娃娃機從房間第二排左邊那顆進去。元素留著是因為 js/cover.js 還會找它 -->
        <button class="cv-cb cv-cl" id="coverClaw" aria-label="去娃娃機" hidden tabindex="-1"></button>
        <button class="cv-acct" id="coverAcct" hidden></button>
      </div>
      <div class="toast" id="toast" role="status"></div>
      <div class="sheet" id="sheet" hidden></div>
      <div class="acct" id="acct" hidden></div>
    </div></div>
<script>(function(){var v='?v='+NEST_V,h='';NEST_JS.forEach(function(n){h+='<script src="js/'+n+'.js'+v+'"><\/script>'});h+='<script type="module" src="js/account.js'+v+'"><\/script>';document.write(h)})();</script>
</body>
</html>
